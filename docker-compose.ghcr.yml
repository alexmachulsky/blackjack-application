# ──────────────────────────────────────────────────────────────
# GHCR E2E override — replaces local build with the versioned GHCR image.
# Used exclusively by the CI E2E job AFTER images are pushed to GHCR.
#
# Usage:
#   IMAGE_TAG=1.0.0 \
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml \
#     up --no-build -d postgres backend
# ──────────────────────────────────────────────────────────────

services:
  backend:
    # Override: use the immutable GHCR image instead of building from source
    image: ghcr.io/alexmachulsky/blackjack-application/backend:${IMAGE_TAG}
    # Remove dev --reload flag; run the image as it will run in production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
