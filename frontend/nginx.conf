server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options           "DENY"                                    always;
    add_header X-Content-Type-Options    "nosniff"                                 always;
    add_header X-XSS-Protection          "1; mode=block"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
      always;

    # Hide nginx version from error pages and headers
    server_tokens off;

    # Proxy API calls to the backend container
    location ~ ^/(api/v1|auth|game|stats|health|ready|metrics) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — serve index.html for all routes so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (repeat security headers because nginx
    # add_header in a nested block replaces server-level headers)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options    "nosniff"                                 always;
        add_header X-Frame-Options           "DENY"                                    always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"         always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    }

    # Disable caching for the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options    "nosniff"                                 always;
        add_header X-Frame-Options           "DENY"                                    always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"         always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    }
}
